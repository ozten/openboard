name: Public website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 website/check.py
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir -p /tmp/public-site
          cp website/index.html website/style.css website/site.js website/icon.svg website/CNAME /tmp/public-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
