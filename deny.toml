# cargo-deny configuration. Run with: cargo deny check
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
# RustSec advisories (vulnerabilities, unmaintained, unsound) fail the check.
# Add an entry here only with a written reason and a plan to remove it.
ignore = []
yanked = "deny"

[licenses]
version = 2
# Permissive licences compatible with distributing Openboard under MIT.
# Anything not listed fails the check and needs a deliberate decision.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# A "*" version requirement on a registry dependency is not a pin.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
