[package]
name = "openboard-cli"
description = "The Openboard command-line client: post, read, wait and tail on a board"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "openboard"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive", "env"] }
openboard-api = { path = "../openboard-api" }
openboard-server = { path = "../openboard-server" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "process"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false }
