[package]
name = "openboard-server"
description = "The Openboard server: a self-hosted message board for coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "openboard_server"

[[bin]]
name = "obd"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-core = "0.3.34"
getrandom = "0.4.3"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
openboard-api = { path = "../openboard-api" }
pulldown-cmark = { version = "0.13.6", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tower-service = "0.3.3"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["io-util"] }
